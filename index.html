<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" style="color-scheme: light;"><head><!-- frame-runtime --><!-- /frame-runtime -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário de Partidas · LoL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&amp;family=Barlow+Condensed:wght@500;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
/* Vazio (violeta/magenta) + Darkin (carmesim). --gold = cor de destaque */
:root{--bg:#07040d;--surface:#0f0918;--surface2:#190f27;--line:#3a2456;--text:#ece6f5;--muted:#a093ba;--gold:#c77dff;--gold-ink:#10041f;--win:#34d9c3;--loss:#e11d48;--shadow:0 0 40px rgba(139,61,255,.25);color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 500px at 10% -10%,rgba(139,61,255,.24),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(225,29,72,.18),transparent 60%),var(--bg);background-attachment:fixed;color:var(--text);font:400 16px/1.5 'Barlow',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px}
h1,h2{font-family:'Cinzel',Georgia,serif;font-weight:800;margin:0;letter-spacing:.04em}
.num{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;margin:0}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:24px;flex:1 1 auto;text-shadow:0 0 18px rgba(139,61,255,.7)}
select,input,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
header select{width:auto;max-width:55vw}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:4px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);box-shadow:0 0 22px rgba(199,125,255,.35)}
.btn.sm{padding:5px 10px;font-size:14px}
.hero{background:linear-gradient(160deg,#1a0d2e,var(--surface) 55%,#1c0a14);box-shadow:inset 0 0 0 1px var(--line);border-radius:4px;padding:18px;margin-bottom:16px;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px))}
.prog{display:flex;align-items:baseline;gap:10px}
.prog .num{font-size:64px;line-height:1;color:var(--gold)}
.prog span{color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:12px 0 16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--loss),var(--gold));border-radius:99px;box-shadow:0 0 12px rgba(199,125,255,.6)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.stats div{background:var(--surface2);border-radius:3px;border-left:2px solid var(--gold);padding:8px 10px}
.stats b{display:block;font:700 24px/1.1 'Barlow Condensed',sans-serif}
.stats small{color:var(--muted)}
.w{color:var(--win)}.l{color:var(--loss)}
.actions{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.actions .btn.gold{flex:1 1 200px;font-size:17px;padding:12px}
.day{margin-bottom:22px}
.day h2{font-size:18px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,var(--loss),var(--gold),transparent) 1;padding-bottom:6px;margin-bottom:8px}
.day h2 small{font:400 14px 'Barlow',sans-serif;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.badge{flex:none;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font:700 20px 'Barlow Condensed',sans-serif;color:#fff}
.badge.W{background:var(--win);color:#04130f}.badge.L{background:var(--loss)}
.info{flex:1;min-width:0}
.info b{font-weight:600}
.meta{color:var(--muted);font-size:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:0 8px;font-size:12px}
.note{font-size:14px;color:var(--muted);margin-top:2px}
.thumb{flex:none;width:64px;height:42px;border-radius:6px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;background:var(--surface2)}
.row .btn{flex:none}
.empty{text-align:center;color:var(--muted);padding:40px 10px;border:1px dashed var(--line);border-radius:14px}
dialog{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:0;width:min(520px,94vw);max-height:92vh;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.form{padding:18px;display:grid;gap:12px}
.form h2{font-size:20px}
label{font-size:14px;color:var(--muted);display:grid;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rs button{border:2px solid var(--line);background:var(--surface2);border-radius:10px;padding:12px;font:700 22px 'Barlow Condensed',sans-serif;cursor:pointer}
.rs button.on.W{background:var(--win);border-color:var(--win);color:#04130f}
.rs button.on.L{background:var(--loss);border-color:var(--loss);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:3px 11px;cursor:pointer;font-size:14px}
.chips button.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;min-height:70px}
.drop img{max-width:100%;max-height:200px;border-radius:6px;display:block;margin:0 auto 6px}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#lb{width:min(96vw,1200px);background:transparent;border:0;box-shadow:none}
#lb img{width:100%;max-height:90vh;object-fit:contain;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);padding:9px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
[hidden]{display:none!important}
body:not(.edit) #newWeek,body:not(.edit) #addM,body:not(.edit) #editW,body:not(.edit) #delW,body:not(.edit) #delTop,body:not(.edit) #dlEdit,body:not(.edit) #dlWeek,body:not(.edit) #dlZip,body:not(.edit) [data-edit],body:not(.edit) [data-del],body.edit #loginBtn,body:not(.edit) #logoutBtn,body.locked #loginBtn{display:none}
#pErr{min-height:1.2em;color:var(--loss)}
@media (max-width:520px){.prog .num{font-size:52px}.thumb{width:52px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="">
<div class="wrap">
  <header>
    <h1>Diário de partidas</h1>
    <select id="weekSel" aria-label="Semana"></select>
    <button class="btn" id="newWeek">Nova semana</button>
    <button class="btn" id="delTop">Excluir semana</button>
    <span class="tag" id="modeTag">Visualização</span>
    <button class="btn" id="loginBtn">Entrar para editar</button>
    <button class="btn" id="logoutBtn">Sair</button>
  </header>
  <main id="app"></main>
</div>

<dialog id="mDlg"><form class="form" id="mForm" method="dialog">
  <h2 id="mTitle">Registrar partida</h2>
  <div class="rs" role="group" aria-label="Resultado">
    <button type="button" data-r="W" class="">Vitória</button><button type="button" data-r="L" class="">Derrota</button>
  </div>
  <div class="two">
    <label>Campeão<input id="fChamp" placeholder="MF" autocomplete="off"></label>
    <label>DPM<input id="fDpm" type="number" min="0" step="1" inputmode="numeric"></label>
  </div>
  <div class="chips" id="chips"></div>
  <label>Observação<input id="fNote" placeholder="Ex.: composição da equipe, observações táticas"></label>
  <label>Data e hora<input id="fWhen" type="datetime-local"></label>
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Adicionar captura de tela">Selecione, arraste ou cole (Ctrl+V) a captura de tela da partida</div>
  <input id="fFile" type="file" accept="image/*" hidden="">
  <div class="foot">
    <button type="button" class="btn" id="mCancel">Cancelar</button>
    <button type="submit" class="btn gold">Salvar partida</button>
  </div>
</form></dialog>

<dialog id="wDlg"><form class="form" id="wForm" method="dialog">
  <h2 id="wTitle">Nova semana</h2>
  <label>Nome<input id="wName" required=""></label>
  <label>Meta de partidas<input id="wGoal" type="number" min="1" required=""></label>
  <div class="foot">
    <button type="button" class="btn" id="wDel" hidden="">Excluir semana</button>
    <button type="button" class="btn" id="wCancel">Cancelar</button>
    <button type="submit" class="btn gold">Salvar semana</button>
  </div>
</form></dialog>

<dialog id="pDlg"><form class="form" id="pForm" method="dialog">
  <h2>Acesso restrito</h2>
  <label>Senha de acesso<input id="pPass" type="password" autocomplete="off" required=""></label>
  <small id="pErr" role="alert"></small>
  <div class="foot"><button type="button" class="btn" id="pCancel">Cancelar</button><button type="submit" class="btn gold">Entrar</button></div>
</form></dialog>

<dialog id="cDlg"><form class="form" method="dialog" onsubmit="return false">
  <h2>Confirmar exclusão</h2>
  <p id="cText" style="margin:0"></p>
  <div class="foot"><button type="button" class="btn" id="cCancel">Cancelar</button><button type="button" class="btn gold" id="cOk">Excluir</button></div>
</form></dialog>

<dialog id="lb"><img id="lbImg" alt="Print da partida"></dialog>
<div id="toast" role="status" class=""></div>
